name: Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -q
          sudo apt-get install -y latexmk \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: Build documentation
        run: make

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: out/documentation.pdf

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Chess Tournament Documentation ${{ github.ref_name }}" \
            --notes "Final documentation for the Chess Club Tournament & Rating Manager." \
            out/documentation.pdf
